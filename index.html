<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark light" />
    <meta name="referrer" content="no-referrer" />
    <title>哲听</title>
    <style>
      body {
        margin: 0;
        background: #0a0a0a;
        font-family: -apple-system, "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
        user-select: none;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      @media (max-width: 600px) {
        html:not(.mobile-runtime) body { overflow-x: hidden; }
      }

      /* ── 开屏：ZT Music 光弧扫过 ── */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 60%, #1C1C1E 0%, #0A0A0A 80%);
        opacity: 0;
        animation: splash-bg-fade-in 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.2s forwards;
        transition: opacity 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        -webkit-tap-highlight-color: transparent;
      }
      #splash.splash-hide {
        opacity: 0 !important;
        pointer-events: none;
        animation: none;
      }

      @keyframes splash-bg-fade-in {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }

      .splash-glow {
        position: absolute;
        width: 60vw;
        height: 60vw;
        max-width: 700px;
        max-height: 700px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 50%, rgba(212, 44, 44, 0.06) 0%, transparent 70%);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        opacity: 0;
        animation: splash-glow-pulse 3s ease-in-out 2s infinite alternate;
      }

      @keyframes splash-glow-pulse {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
        100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1.1); }
      }

      .splash-top-line {
        position: absolute;
        top: clamp(32px, 6vh, 60px);
        left: 50%;
        transform: translateX(-50%);
        width: clamp(40px, 6vw, 80px);
        height: 1px;
        background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.15), transparent);
        opacity: 0;
        animation: splash-line-in 1.2s ease-out 1.8s forwards;
      }

      @keyframes splash-line-in {
        0% { opacity: 0; width: 0; }
        100% { opacity: 1; width: clamp(40px, 6vw, 80px); }
      }

      .splash-hero {
        position: relative;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 0;
        transform: scale(1.05);
        opacity: 0.6;
        animation: splash-hero-entry 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.6s forwards;
        -webkit-tap-highlight-color: transparent;
      }

      @keyframes splash-hero-entry {
        0% { transform: scale(1.05); opacity: 0.6; }
        100% { transform: scale(1); opacity: 1; }
      }

      .splash-zt {
        position: relative;
        display: inline-block;
      }

      .splash-zt-base,
      .splash-zt-mask {
        font-size: clamp(80px, 22vw, 190px);
        font-weight: 900;
        letter-spacing: -0.03em;
        line-height: 1;
        display: block;
      }

      .splash-zt-base {
        color: #5A5A5E;
        position: relative;
        z-index: 1;
        text-shadow: 0 2px 40px rgba(0, 0, 0, 0.6);
      }

      .splash-zt-mask {
        color: #D42C2C;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 2;
        -webkit-mask-image: radial-gradient(ellipse 35% 90% at center, #000 0%, #000 45%, transparent 70%, transparent 100%);
        -webkit-mask-size: 32% 100%;
        -webkit-mask-position: -32% 0;
        -webkit-mask-repeat: no-repeat;
        mask-image: radial-gradient(ellipse 35% 90% at center, #000 0%, #000 45%, transparent 70%, transparent 100%);
        mask-size: 32% 100%;
        mask-position: -32% 0;
        mask-repeat: no-repeat;
        animation: splash-arc-sweep 1.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 1s forwards;
      }

      @keyframes splash-arc-sweep {
        0% {
          -webkit-mask-position: -32% 0;
          mask-position: -32% 0;
        }
        70% {
          -webkit-mask-position: 70% 0;
          mask-position: 70% 0;
        }
        100% {
          -webkit-mask-position: 100% 0;
          mask-position: 100% 0;
        }
      }

      .splash-zt-mask.revealed {
        -webkit-mask-image: none !important;
        mask-image: none !important;
        -webkit-mask-size: auto !important;
        mask-size: auto !important;
        -webkit-mask-position: 0 0 !important;
        mask-position: 0 0 !important;
        animation: none !important;
      }

      .splash-music {
        font-size: clamp(24px, 5.5vw, 52px);
        font-weight: 600;
        letter-spacing: 0.1em;
        color: #B0B0B6;
        margin-left: clamp(6px, 1.2vw, 16px);
        margin-bottom: clamp(6px, 1vw, 12px);
        opacity: 0;
        transform: translateY(6px);
        animation: splash-music-in 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94) 2.4s forwards;
        text-shadow: 0 1px 20px rgba(0, 0, 0, 0.5);
      }

      @keyframes splash-music-in {
        0% { opacity: 0; transform: translateY(6px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      .splash-footer {
        position: absolute;
        bottom: clamp(36px, 8vh, 72px);
        left: 0;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 2px;
        opacity: 0;
        animation: splash-footer-in 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) 2.6s forwards;
        -webkit-tap-highlight-color: transparent;
      }

      @keyframes splash-footer-in {
        0% { opacity: 0; transform: translateY(8px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      .splash-footer-label {
        font-size: clamp(15px, 2.4vw, 22px);
        font-weight: 400;
        letter-spacing: 0.06em;
        color: #7A7A80;
        margin-right: 4px;
      }

      .splash-dots {
        display: flex;
        align-items: center;
        gap: 3px;
      }

      .splash-dots span {
        display: inline-block;
        width: clamp(5px, 0.7vw, 8px);
        height: clamp(5px, 0.7vw, 8px);
        border-radius: 50%;
        background: #7A7A80;
        opacity: 0.3;
        animation: splash-dot-pulse 1.8s ease-in-out infinite;
      }

      .splash-dots span:nth-child(1) { animation-delay: 0s; }
      .splash-dots span:nth-child(2) { animation-delay: 0.3s; }
      .splash-dots span:nth-child(3) { animation-delay: 0.6s; }

      @keyframes splash-dot-pulse {
        0%, 100% { opacity: 0.25; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.15); }
      }

      @media (max-width: 480px) {
        .splash-music {
          margin-left: 4px;
          margin-bottom: 4px;
        }
        .splash-zt-base,
        .splash-zt-mask {
          font-size: clamp(56px, 18vw, 80px);
        }
        .splash-footer {
          bottom: clamp(24px, 5vh, 40px);
        }
      }

      @media (min-width: 768px) and (max-width: 1024px) {
        .splash-zt-base,
        .splash-zt-mask {
          font-size: clamp(100px, 16vw, 140px);
        }
      }

      @supports not ((-webkit-mask-image: none) or (mask-image: none)) {
        .splash-zt-mask {
          color: #D42C2C;
          opacity: 0;
          animation: splash-fallback-fade 1.2s ease-in 1.8s forwards;
        }
        @keyframes splash-fallback-fade {
          0% { opacity: 0; }
          100% { opacity: 1; }
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #splash,
        .splash-glow,
        .splash-top-line,
        .splash-hero,
        .splash-zt-mask,
        .splash-music,
        .splash-footer,
        .splash-dots span {
          animation: none !important;
        }
        #splash { opacity: 1; }
        .splash-hero,
        .splash-music,
        .splash-footer { opacity: 1; transform: none; }
        .splash-zt-mask {
          -webkit-mask-image: none;
          mask-image: none;
        }
      }
    </style>
    <script>
      // 同步判定移动端，提前设置 class，避免样式闪烁
      if (window.innerWidth <= 600 || window.location.search.includes('mobile')) {
        document.documentElement.classList.add('mobile-runtime')
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div id="splash">
      <div class="splash-glow"></div>
      <div class="splash-top-line"></div>
      <div class="splash-hero">
        <div class="splash-zt">
          <span class="splash-zt-base">ZT</span>
          <span class="splash-zt-mask" id="splashZtMask">ZT</span>
        </div>
        <span class="splash-music">Music</span>
      </div>
      <div class="splash-footer">
        <span class="splash-footer-label">少女祈祷中</span>
        <span class="splash-dots">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </div>
    </div>
    <script>
      (function () {
        'use strict'
        var ztMask = document.getElementById('splashZtMask')
        if (!ztMask) return

        function revealRed() {
          ztMask.classList.add('revealed')
        }

        ztMask.addEventListener('animationend', function handler(e) {
          if (e.animationName === 'splash-arc-sweep') {
            revealRed()
            ztMask.removeEventListener('animationend', handler)
          }
        })

        // arcSweep 1.8s + delay 1s；兜底避免 animationend 未触发
        setTimeout(function () {
          if (!ztMask.classList.contains('revealed')) revealRed()
        }, 3200)
      })()
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
