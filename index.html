<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark light" />
    <meta name="referrer" content="no-referrer" />
    <title>哲听</title>
    <style>
      html,
      body,
      #app {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: #0a0a0a;
        font-family: 'HarmonyOS Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        user-select: none;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      @media (max-width: 600px) {
        html:not(.mobile-runtime) body { overflow-x: hidden; }
      }
    </style>
    <script>
      ;(function () {
        // 在模块和完整 CSS 之前同步设置移动布局与上次主题，避免首帧白闪/错布局。
        if (window.innerWidth <= 600 || window.location.search.includes('mobile')) {
          document.documentElement.classList.add('mobile-runtime')
        }
        try {
          var nativeAndroid = !!window.__TAURI_INTERNALS__ && /Android/i.test(navigator.userAgent)
          var mobile = document.documentElement.classList.contains('mobile-runtime') || nativeAndroid
          if (nativeAndroid) document.documentElement.classList.add('mobile-runtime', 'android-startup-pending')
          var theme = localStorage.getItem('zheting-theme')
          if (theme !== 'light' && theme !== 'dark') theme = nativeAndroid && !matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark'
          if (theme === 'light' || theme === 'dark') {
            var color = mobile ? (theme === 'light' ? '#ffffff' : '#111113') : (theme === 'light' ? '#e8e8ed' : '#0a0a0a')
            document.documentElement.dataset.theme = theme
            document.documentElement.style.colorScheme = theme
            document.documentElement.style.backgroundColor = color
            var themeMeta = document.querySelector('meta[name="theme-color"]')
            if (themeMeta) themeMeta.setAttribute('content', color)
            document.addEventListener('DOMContentLoaded', function () {
              document.body.style.backgroundColor = color
            }, { once: true })
          }
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script>
      ;(function () {
        'use strict'
        var startupPending = true

        window.addEventListener('ztmusic:startup-ready', function () {
          startupPending = false
        }, { once: true })

        function startupMessage(error) {
          if (error && error.error) error = error.error
          if (error && (error.stack || error.message)) return error.stack || error.message
          if (error && error.target && error.target.src) return '无法加载：' + error.target.src
          return String(error || '未知错误')
        }

        function showStartupError(error) {
          if (!startupPending) return
          startupPending = false
          var app = document.getElementById('app')
          if (!app) return
          app.textContent = ''
          var panel = document.createElement('pre')
          panel.setAttribute('role', 'alert')
          panel.style.cssText = 'box-sizing:border-box;max-width:760px;margin:12vh auto;padding:18px;white-space:pre-wrap;word-break:break-word;color:#fff;background:#2a0d10;border:1px solid rgba(255,49,64,.45);font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;'
          panel.textContent = '哲听启动失败\n\n' + startupMessage(error)
          app.appendChild(panel)
          // A rendered diagnostic must also release the native splash if module loading failed.
          if (window.__TAURI_INTERNALS__ && /Android/i.test(navigator.userAgent)) {
            window.__TAURI_INTERNALS__.invoke('plugin:zt-player|execute', {
              payload: { action: 'startupReady', data: { theme: document.documentElement.dataset.theme, reducedMotion: matchMedia('(prefers-reduced-motion: reduce)').matches } }
            }).catch(function () {})
          }
        }

        window.addEventListener('error', function (event) {
          showStartupError(event)
        })
        window.addEventListener('unhandledrejection', function (event) {
          showStartupError(event.reason)
        })
        window.addEventListener('ztmusic:startup-error', function (event) {
          showStartupError(event.detail)
        })
      })()
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
