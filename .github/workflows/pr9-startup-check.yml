name: PR9 Android Startup Checks
on:
  push:
    branches: [fix/mobile-ui-polish]
    paths: [.github/workflows/pr9-startup-check.yml]
permissions:
  contents: read
  actions: read
env:
  STARTUP_APK_RUN_ID: '37250198468'
jobs:
  artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Wait for verified APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            result=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$STARTUP_APK_RUN_ID/jobs" --jq '.jobs[] | select(.name == "Android arm64 test APK") | [.status, .conclusion] | join(":")')
            if [[ "$result" == "completed:success" ]]; then exit 0; fi
            if [[ "$result" == completed:* ]]; then exit 1; fi
            sleep 10
          done
          exit 1
  startup:
    name: Startup API ${{ matrix.api }}
    needs: artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [31, 33, 34, 35, 36]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v5
        with:
          name: startup-emulator-apk
          path: emulator-apk
          run-id: ${{ env.STARTUP_APK_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install WebView inspection client
        run: |
          npm install --prefix "$RUNNER_TEMP/startup-browser" --no-package-lock playwright@1.56.1
          echo "PR9_PLAYWRIGHT_MODULE=$RUNNER_TEMP/startup-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Verify cold startup offline and saved theme
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r emulator-apk/*.apk
            node scripts/browser/android-startup.mjs
      - name: Capture emulator logs
        if: always()
        run: |
          mkdir -p startup-artifacts
          adb logcat -d > startup-artifacts/logcat.txt || true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: startup-api-${{ matrix.api }}-${{ github.sha }}
          path: startup-artifacts
          retention-days: 7

# Keep the frame reporter usable as a Svelte action and guard pre-26 animation APIs.

# Defer native controller startup and skip the redundant WebView queue before the first frame.
