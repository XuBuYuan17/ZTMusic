name: PR9 Test APK

on:
  workflow_dispatch:
  push:
    branches: [fix/mobile-ui-polish]
    paths: [.github/workflows/pr9-test-apk.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: android-apk-${{ github.repository }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.28.1
  RUST_TOOLCHAIN: 1.88.0
  ANDROID_API_LEVEL: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'
  ANDROID_NDK_VERSION: '27.2.12479018'
  ANDROID_CONFIG: '{"productName":"哲听测试版","identifier":"com.zheting.music.androidtest"}'
  CARGO_NET_RETRY: 10
  CARGO_HTTP_TIMEOUT: 120
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  PNPM_CONFIG_FETCH_RETRIES: 5

jobs:
  apk:
    name: Android arm64 test APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source
        run: |
          pnpm check:versions
          pnpm check
          pnpm test

      - name: Require mobile rendering regression checks
        if: github.ref == 'refs/heads/fix/mobile-ui-polish'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            result=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA" --jq '.workflow_runs[] | select(.name == "PR9 Mobile Render") | [.status, .conclusion] | join(":")' | head -n 1)
            if [[ "$result" == "completed:success" ]]; then exit 0; fi
            if [[ "$result" == completed:* ]]; then
              echo "Mobile rendering checks did not pass: $result" >&2
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for mobile rendering checks" >&2
          exit 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-$ANDROID_API_LEVEL" "build-tools;$ANDROID_BUILD_TOOLS" "ndk;$ANDROID_NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android-aarch64-debug

      - name: Reuse test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-${{ github.repository_id }}-v1

      - name: Initialize Android project
        run: pnpm tauri android init --ci --skip-targets-install --config "$ANDROID_CONFIG"

      - name: Generate app icons
        run: pnpm tauri icon src-tauri/icons/icon.png

      - name: Build test APK
        env:
          VITE_APP_CHANNEL: dev
          VITE_BUILD_SHA: ${{ github.sha }}
        run: pnpm tauri android build --ci --debug --apk --target aarch64 --config "$ANDROID_CONFIG"

      - name: Test Android native plugin
        run: |
          cd src-tauri/gen/android
          ./gradlew testDebugUnitTest

      - name: Verify APK signature and checksums
        run: |
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | sort)
          if (( ${#apks[@]} == 0 )); then
            echo "No APK files were generated" >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" verify --verbose "$apk"
            sha256sum "$apk"
          done

      - name: Upload test APK
        uses: actions/upload-artifact@v5
        with:
          name: zheting-android-arm64-debug-${{ github.run_number }}-${{ github.sha }}
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        run: |
          {
            echo 'Android arm64 测试 APK 已生成并通过签名校验。'
            echo '在本次运行的 Artifacts 下载 APK 压缩包，解压后安装到手机。'
            echo '包名：com.zheting.music.androidtest；签名：Android debug key。'
            echo '测试包已编译 Media3 原生播放插件；后台播放、媒体控制和歌词仍需真机验收。'
          } >> "$GITHUB_STEP_SUMMARY"

# Library appearance: verify scoped component overrides before packaging.
# Allow theme color transitions to settle during browser comparison.
