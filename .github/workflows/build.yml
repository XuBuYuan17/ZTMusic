name: Build Installers

on:
  push:
    branches: [main, dev]
    tags:
      - 'v*'
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Build Windows installers'
        required: true
        type: boolean
        default: false
      build_linux:
        description: 'Build Linux packages'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.28.1
  RUST_TOOLCHAIN: 1.88.0
  CARGO_NET_RETRY: 10
  CARGO_HTTP_TIMEOUT: 120
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  PNPM_CONFIG_FETCH_RETRIES: 5
  PNPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 10000
  PNPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 60000

jobs:
  source-check:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      channel: ${{ steps.context.outputs.channel }}
      short-sha: ${{ steps.context.outputs.short-sha }}
      build-windows: ${{ steps.context.outputs.build-windows }}
      build-linux: ${{ steps.context.outputs.build-linux }}
      publish: ${{ steps.context.outputs.publish }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select build channel
        id: context
        env:
          BUILD_WINDOWS: ${{ inputs.build_windows }}
          BUILD_LINUX: ${{ inputs.build_linux }}
        run: node scripts/build-channel.mjs

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/validate-release-tag.mjs

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source
        run: pnpm verify

  windows:
    name: Windows installer ${{ matrix.arch }}
    needs: source-check
    if: needs.source-check.outputs.build-windows == 'true'
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            bundles: nsis

    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: windows-${{ matrix.target }}-${{ needs.source-check.outputs.channel }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Print Windows build context
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          pnpm tauri --version
          echo "target=${{ matrix.target }} bundles=${{ matrix.bundles }}"

      - name: Build Windows development installer
        if: needs.source-check.outputs.channel == 'dev'
        env:
          VITE_APP_CHANNEL: dev
          VITE_BUILD_SHA: ${{ github.sha }}
        run: pnpm tauri build --ci --verbose --config src-tauri/tauri.dev.conf.json --features dev-channel --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Build Windows installer
        if: needs.source-check.outputs.channel == 'stable'
        run: pnpm tauri build --ci --verbose --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Upload Windows installer
        uses: actions/upload-artifact@v5
        with:
          name: zheting-${{ needs.source-check.outputs.channel }}-windows-${{ matrix.arch }}-${{ github.run_number }}-${{ needs.source-check.outputs.short-sha }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux packages
    needs: source-check
    if: needs.source-check.outputs.build-linux == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install Linux deps
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            libssl-dev libdbus-1-dev rpm

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: linux-packages-${{ needs.source-check.outputs.channel }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux development packages
        if: needs.source-check.outputs.channel == 'dev'
        env:
          VITE_APP_CHANNEL: dev
          VITE_BUILD_SHA: ${{ github.sha }}
        run: pnpm tauri build --ci --verbose --config src-tauri/tauri.dev.conf.json --features dev-channel --bundles deb,rpm

      - name: Build Linux packages
        if: needs.source-check.outputs.channel == 'stable'
        run: pnpm tauri build --ci --verbose --bundles deb,rpm

      - name: Upload Linux packages
        uses: actions/upload-artifact@v5
        with:
          name: zheting-${{ needs.source-check.outputs.channel }}-linux-${{ github.run_number }}-${{ needs.source-check.outputs.short-sha }}
          path: |
            src-tauri/target/release/bundle/deb/**
            src-tauri/target/release/bundle/rpm/**
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: needs.source-check.outputs.publish == 'true'
    needs: [source-check, windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract release notes from CHANGELOG
        id: changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if [[ -f CHANGELOG.md ]]; then
            NOTES=$(awk "/^## \\[$VERSION\\] - /{flag=1;next} /^## \\[/{flag=0} flag" CHANGELOG.md)
          else
            NOTES=""
          fi
          if [[ -z "$NOTES" ]]; then
            NOTES="See full changelog in CHANGELOG.md"
          fi
          {
            echo 'body<<EOF'
            echo "$NOTES"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
          files: |
            artifacts/**/*.exe
            artifacts/**/*.deb
            artifacts/**/*.rpm
