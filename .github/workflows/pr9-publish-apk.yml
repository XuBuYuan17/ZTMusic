name: Publish PR9 test APK

on:
  push:
    branches:
      - fix/mobile-ui-polish

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish direct APK
    runs-on: ubuntu-24.04
    steps:
      - name: Download verified APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37206312845 --repo ${{ github.repository }} --name zheting-android-arm64-debug-2-b5c3b85aec5ab63f77037e731d4083f5f8f61dfb

      - name: Publish test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="$(find . -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          gh release create pr9-test-b5c3b85 \
            --repo "${{ github.repository }}" \
            --target b5c3b85aec5ab63f77037e731d4083f5f8f61dfb \
            --prerelease \
            --title "PR9 Android 测试包 b5c3b85" \
            --notes "PR9 真机验收测试包。arm64 debug APK，包名 com.zheting.music.androidtest。APK SHA-256: d55d96d1eb0f5dd77d3741fd6b9b6978f244236c0c6b215c2386db71565e8baa" \
            "$apk#ZTMusic-PR9-arm64-debug.apk"
