name: Upload PR9 APK direct

on:
  push:
    branches:
      - fix/mobile-ui-polish

permissions:
  actions: read
  contents: read

jobs:
  upload:
    name: Upload direct APK
    runs-on: ubuntu-24.04
    steps:
      - name: Download verified APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37206312845 --repo ${{ github.repository }} --name zheting-android-arm64-debug-2-b5c3b85aec5ab63f77037e731d4083f5f8f61dfb

      - name: Upload APK to temporary direct link
        run: |
          apk="$(find . -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          test "$(sha256sum "$apk" | cut -d' ' -f1)" = "d55d96d1eb0f5dd77d3741fd6b9b6978f244236c0c6b215c2386db71565e8baa"
          url="$(curl --fail --show-error --silent --max-time 300 --upload-file "$apk" https://transfer.sh/ZTMusic-PR9-arm64-debug.apk)"
          echo "DIRECT_APK_URL=$url"
